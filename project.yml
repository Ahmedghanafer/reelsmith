name: Reelsmith
options:
  deploymentTarget:
    iOS: "26.0"
packages:
  ReelsmithCore:
    path: .
targets:
  Reelsmith:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: ReelsmithCore
    scheme: {}
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ghanafer.reelsmith
      TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        GitCommit: $(GIT_COMMIT)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
