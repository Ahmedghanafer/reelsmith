name: Reelsmith
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
packages:
  ReelsmithCore:
    path: .
targets:
  Reelsmith:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: ReelsmithCore
      - package: ReelsmithCore
        product: ReelsmithEngine
    scheme:
      testTargets:
        - ReelsmithUITests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ghanafer.reelsmith
      SWIFT_VERSION: "5.0"
      TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        GitCommit: $(GIT_COMMIT)
        NSPhotoLibraryAddUsageDescription: Reelsmith saves your finished video to your photo library.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  ReelsmithUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Reelsmith
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ghanafer.reelsmith.uitests
      SWIFT_VERSION: "5.0"
      GENERATE_INFOPLIST_FILE: YES
