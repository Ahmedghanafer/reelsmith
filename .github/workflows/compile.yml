name: Compile check

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  compile:
    if: github.event_name != 'pull_request' || github.event.label.name == 'compile'
    runs-on: macos-26
    # The cold Flutter build for the simulator (290 s), the build for testing (115 s) and swift test (622 s), a third added.
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Read the Flutter version
        id: flutter
        run: echo "version=$(cat .github/flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - name: Test the package on macOS
        if: ${{ !cancelled() }}
        env:
          REELSMITH_CLIP_DIR: ${{ runner.temp }}/clips
        run: swift test

      - name: Build the Flutter app for a simulator
        id: app
        if: ${{ !cancelled() }}
        working-directory: app
        run: |
          flutter --version
          flutter build ios --simulator --debug

      - name: Build the app and the UI tests for testing
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: |
          udid=$(xcrun simctl list devices available --json | jq -er '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild build-for-testing -workspace app/ios/Runner.xcworkspace -scheme Runner -destination "id=$udid" \
            -derivedDataPath build/simulator

      - name: Lint the word files
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          files=(app/assets/words/*.lproj/*.strings)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No word file in app/assets/words."
            exit 1
          fi
          plutil -lint "${files[@]}"
