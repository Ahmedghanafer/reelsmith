name: Tests

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: swift test

  # The Flutter app's tests, on the Flutter version of .github/flutter-version.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read the Flutter version
        id: flutter
        run: echo "version=$(cat .github/flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      # The pinned Pigeon writes the two files of the engine's API again. They must equal the committed ones.
      - name: Pigeon gives the committed files
        working-directory: app
        run: |
          flutter pub get
          dart run pigeon --input pigeons/engine.dart
          git add --intent-to-add lib/engine/engine_api.g.dart ios/Runner/Engine/EngineApi.g.swift
          git diff --exit-code
      - name: Upload the generated files
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pigeon-generated
          path: |
            app/lib/engine/engine_api.g.dart
            app/ios/Runner/Engine/EngineApi.g.swift
      - name: Flutter test
        working-directory: app
        run: |
          flutter --version
          flutter pub get
          flutter test

  # The Dart Core's tests. Each step is skipped while the folder of the package is missing.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read the Flutter version
        id: flutter
        if: ${{ hashFiles('packages/reelsmith_core/pubspec.yaml') != '' }}
        run: echo "version=$(cat .github/flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        if: ${{ hashFiles('packages/reelsmith_core/pubspec.yaml') != '' }}
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      - name: Dart test
        if: ${{ hashFiles('packages/reelsmith_core/pubspec.yaml') != '' }}
        working-directory: packages/reelsmith_core
        run: |
          dart pub get
          dart test
