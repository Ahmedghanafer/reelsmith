name: macOS build

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.label.name == 'macos-run'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Generate the project
        run: |
          brew install xcodegen
          xcodegen generate
          echo "project generation: ${SECONDS}s" >> "$RUNNER_TEMP/timings.txt"

      - name: Build for the simulator
        run: |
          udid=$(xcrun simctl list devices available --json | jq -er '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
          xcodebuild build -project Reelsmith.xcodeproj -scheme Reelsmith -destination "id=$udid" \
            -derivedDataPath build/simulator GIT_COMMIT="$(git rev-parse --short HEAD)"
          echo "simulator build: ${SECONDS}s" >> "$RUNNER_TEMP/timings.txt"

      - name: Boot the simulator and take the screenshot
        run: |
          xcrun simctl bootstatus "$SIMULATOR" -b
          xcrun simctl install "$SIMULATOR" build/simulator/Build/Products/Debug-iphonesimulator/Reelsmith.app
          xcrun simctl launch "$SIMULATOR" com.ghanafer.reelsmith
          sleep 10
          xcrun simctl spawn "$SIMULATOR" launchctl list | grep com.ghanafer.reelsmith
          xcrun simctl io "$SIMULATOR" screenshot first-screen.png
          echo "simulator boot and screenshot: ${SECONDS}s" >> "$RUNNER_TEMP/timings.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: first-screen.png
          if-no-files-found: error

      - name: Build for a device without code signing
        run: |
          xcodebuild build -project Reelsmith.xcodeproj -scheme Reelsmith -configuration Release \
            -destination "generic/platform=iOS" -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO GIT_COMMIT="$(git rev-parse --short HEAD)"
          mkdir Payload
          cp -R build/device/Build/Products/Release-iphoneos/Reelsmith.app Payload/
          zip -qr Reelsmith.ipa Payload
          echo "device build: ${SECONDS}s" >> "$RUNNER_TEMP/timings.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: Reelsmith.ipa
          if-no-files-found: error

      - name: Print the step timings
        run: cat "$RUNNER_TEMP/timings.txt"
