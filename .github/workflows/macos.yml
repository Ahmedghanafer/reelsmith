name: macOS build

on:
  workflow_dispatch:
    inputs:
      ipa:
        description: Also make the unsigned device build
        type: boolean
        default: false
      classes:
        description: UI test classes to run with the smoke set, separated by spaces or commas (empty runs every UI test)
        type: string
        default: ""
      split:
        description: Run every UI test in three groups on three machines
        type: boolean
        default: false
      image_simulator:
        description: Use the image's own iPhone 17 on iOS 26.5 if it has one
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # The smoke set, added to a run of named classes: a start with no seed, a start on a seed, the first
  # frame of the preview, one edit on the strip and an export that reaches the saved panel.
  SMOKE_TESTS: >-
    StartTests/testWithNoSeedTheStartScreenShowsWithLandscapeChosen
    HarnessTests/testASeedStartOpensTheShellAndWritesItsClips
    PreviewTests/testTheFirstFrameIsInAnAreaOfTheShapeOfTheCanvas
    ToolsTests/testASplitAtOneSecondThenADeleteOfTheFirstBlock
    ExportPanelTests/testAnExportReachesTheSavedPanelAndDoneReturnsToTheEditorAsItWas

jobs:
  build:
    # Group 0 is the one machine of a run that is not split, and keeps the names of today.
    name: ${{ matrix.group == 0 && 'build' || format('build {0}', matrix.group) }}
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(inputs.split && '[1, 2, 3]' || '[0]') }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.6 and create the simulator
        id: setup
        env:
          IMAGE_SIMULATOR: ${{ inputs.image_simulator }}
        run: |
          trap 'echo "setup: ${SECONDS}s" | tee -a "$RUNNER_TEMP/timings.txt"' EXIT
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcrun simctl list runtimes
          runtime=$(xcrun simctl list runtimes --json | jq -er '[.runtimes[] | select(.name == "iOS 26.5" and .isAvailable)][0].identifier')
          xcrun simctl list devices
          udid=""
          if [ "$IMAGE_SIMULATOR" = true ]; then
            udid=$(xcrun simctl list devices --json | jq -r --arg runtime "$runtime" '[.devices[$runtime][]? | select(.name == "iPhone 17" and .isAvailable)][0].udid // empty')
            if [ -z "$udid" ]; then
              echo "The image has no iPhone 17 on $runtime."
            fi
          fi
          if [ -n "$udid" ]; then
            echo "SIMULATOR_ORIGIN=of the image" >> "$GITHUB_ENV"
            echo "Uses the simulator of the image $udid on $runtime"
          else
            udid=$(xcrun simctl create "Reelsmith wave run" "iPhone 17" "$runtime")
            echo "SIMULATOR_ORIGIN=created by the run" >> "$GITHUB_ENV"
            echo "Created the simulator $udid on $runtime"
          fi
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"

      - name: "Layer 1: build the package and run its tests on macOS"
        id: layer1
        if: ${{ !cancelled() }}
        env:
          REELSMITH_CLIP_DIR: ${{ runner.temp }}/clips
        run: |
          trap 'echo "layer 1: ${SECONDS}s" | tee -a "$RUNNER_TEMP/timings.txt"' EXIT
          swift test
          ls -l "$REELSMITH_CLIP_DIR"

      - name: "Layer 2: generate the project and build app and UI tests for testing"
        id: layer2
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          trap 'echo "layer 2: ${SECONDS}s" | tee -a "$RUNNER_TEMP/timings.txt"' EXIT
          brew install xcodegen
          xcodegen generate
          xcodebuild build-for-testing -project Reelsmith.xcodeproj -scheme Reelsmith -destination "id=$SIMULATOR" \
            -derivedDataPath build/simulator GIT_COMMIT="$(git rev-parse --short HEAD)"

      - name: "Layer 3: boot the simulator, install the app, grant Photos, add the clips"
        id: layer3
        if: ${{ !cancelled() && steps.layer2.outcome == 'success' }}
        env:
          REELSMITH_CLIP_DIR: ${{ runner.temp }}/clips
        run: |
          trap 'echo "layer 3: ${SECONDS}s" | tee -a "$RUNNER_TEMP/timings.txt"' EXIT
          xcrun simctl bootstatus "$SIMULATOR" -b
          echo "the boot, inside layer 3, of the simulator $SIMULATOR_ORIGIN: ${SECONDS}s" | tee -a "$RUNNER_TEMP/timings.txt"
          xcrun simctl install "$SIMULATOR" build/simulator/Build/Products/Debug-iphonesimulator/Reelsmith.app
          xcrun simctl privacy "$SIMULATOR" grant photos-add com.ghanafer.reelsmith
          own=$(sqlite3 -readonly "$HOME/Library/Developer/CoreSimulator/Devices/$SIMULATOR/data/Media/PhotoData/Photos.sqlite" "select count(*) from ZASSET where ZKIND = 0 and ZTRASHEDSTATE = 0") || own="could not be read"
          echo "Photos in the library before any addmedia: $own" | tee -a "$RUNNER_TEMP/library.txt"
          if xcrun simctl addmedia "$SIMULATOR" "$REELSMITH_CLIP_DIR/blue.mov" "$REELSMITH_CLIP_DIR/red.mov"; then
            echo "Clips into the library: taken" | tee -a "$RUNNER_TEMP/library.txt"
          else
            echo "Clips into the library: not taken" | tee -a "$RUNNER_TEMP/library.txt"
          fi
          if xcrun simctl addmedia "$SIMULATOR" "$REELSMITH_CLIP_DIR/magenta.png"; then
            echo "Photo into the library: taken" | tee -a "$RUNNER_TEMP/library.txt"
          else
            echo "Photo into the library: not taken" | tee -a "$RUNNER_TEMP/library.txt"
          fi
          library="$HOME/Library/Developer/CoreSimulator/Devices/$SIMULATOR/data/Media/PhotoData/Photos.sqlite"
          count=$(sqlite3 -readonly "$library" "select count(*) from ZASSET where ZKIND = 1 and ZTRASHEDSTATE = 0") || count="could not be read"
          echo "Videos in the library before the UI tests: $count" | tee -a "$RUNNER_TEMP/library.txt"
          photos=$(sqlite3 -readonly "$library" "select count(*) from ZASSET where ZKIND = 0 and ZTRASHEDSTATE = 0") || photos="could not be read"
          echo "Photos in the library before the UI tests: $photos" | tee -a "$RUNNER_TEMP/library.txt"
          # The simulator's own photos stand at the end of a grid that offers photos, so the UI tests skip them:
          # every photo but the test photo.
          if [[ "$photos" =~ ^[1-9][0-9]*$ ]]; then
            echo "TEST_RUNNER_REELSMITH_OWN_PHOTOS=$((photos - 1))" >> "$GITHUB_ENV"
          fi

      - name: Write a tone file into the Files app of the simulator
        if: ${{ !cancelled() && steps.layer3.outcome == 'success' }}
        continue-on-error: true
        run: |
          # The storage of the Files app is the app group whose metadata names the local storage of the file
          # provider. A tone of 3 seconds at 440 Hz, mono, 16 bit at 44100 samples a second, goes into its folder.
          data="$HOME/Library/Developer/CoreSimulator/Devices/$SIMULATOR/data"
          metadata=$(grep -l -r --include=.com.apple.mobile_container_manager.metadata.plist \
            "group.com.apple.FileProvider.LocalStorage" "$data/Containers/Shared/AppGroup" | head -n 1 || true)
          if [ -z "$metadata" ]; then
            echo "No storage of the Files app was found under $data/Containers/Shared/AppGroup."
            exit 0
          fi
          folder="$(dirname "$metadata")/File Provider Storage"
          mkdir -p "$folder"
          python3 - "$folder/tone.wav" <<'EOF'
          import math, struct, sys, wave
          rate = 44100
          with wave.open(sys.argv[1], "wb") as out:
              out.setnchannels(1)
              out.setsampwidth(2)
              out.setframerate(rate)
              out.writeframes(b"".join(struct.pack("<h", int(16383 * math.sin(2 * math.pi * 440 * n / rate))) for n in range(3 * rate)))
          EOF
          ls -la "$folder"

      - name: "Layer 4: record the simulator and run the UI tests"
        id: layer4
        if: ${{ !cancelled() && steps.layer2.outcome == 'success' }}
        env:
          CLASSES: ${{ inputs.classes }}
          GROUP: ${{ matrix.group }}
        run: |
          trap 'echo "layer 4: ${SECONDS}s" | tee -a "$RUNNER_TEMP/timings.txt"' EXIT
          # What this run executes. The test classes are read from the files of UITests, one class a file.
          # Named classes run with the smoke set, a group of a split run takes every third class by name,
          # and with neither every UI test runs. A test is chosen with -only-testing of xcodebuild:
          # https://developer.apple.com/library/archive/technotes/tn2339/_index.html
          all=""
          counts=""
          total=0
          for file in UITests/*.swift; do
            class=$(sed -n -E 's/.*class[[:space:]]+([A-Za-z0-9_]+)[[:space:]]*:[[:space:]]*XCTestCase.*/\1/p' "$file")
            count=$(grep -c -E '^[[:space:]]*func test' "$file" || true)
            # A run that chooses tests needs one test class in each file with tests, or a class is in no group.
            set -- $class
            if [ "$#" -eq 0 ] && [ "$count" -eq 0 ]; then
              continue
            fi
            if [ "$#" -ne 1 ] && { [ -n "$CLASSES" ] || [ "$GROUP" != 0 ]; }; then
              echo "Not one test class in $file, so a class would be in no group. Found: $*" | tee "$RUNNER_TEMP/selection.txt"
              exit 1
            fi
            all="$all $*"
            counts="$counts $*=$count"
            total=$((total + count))
          done
          deeper=$(grep -r -l -E 'class[[:space:]]+[A-Za-z0-9_]+[[:space:]]*:[[:space:]]*XCTestCase' UITests/*/ || true)
          if [ -n "$deeper" ] && { [ -n "$CLASSES" ] || [ "$GROUP" != 0 ]; }; then
            echo "A test class in a folder under UITests would be in no group:" $deeper | tee "$RUNNER_TEMP/selection.txt"
            exit 1
          fi
          tests_of() {
            for pair in $counts; do
              if [ "${pair%%=*}" = "$1" ]; then
                echo "${pair#*=}"
              fi
            done
          }
          only=()
          chosen=""
          selected=0
          if [ -n "$CLASSES" ] && [ "$GROUP" != 0 ]; then
            echo "Both classes and split are set. A run takes one of them." | tee "$RUNNER_TEMP/selection.txt"
            exit 1
          fi
          if [ -n "$CLASSES" ]; then
            for class in $(printf '%s' "$CLASSES" | tr ',' ' '); do
              if [[ " $all " != *" $class "* ]]; then
                echo "No UI test class is named $class. The classes are:$all" | tee "$RUNNER_TEMP/selection.txt"
                exit 1
              fi
              if [[ " $chosen " == *" $class "* ]]; then
                continue
              fi
              chosen="$chosen $class"
              only+=("-only-testing:ReelsmithUITests/$class")
              selected=$((selected + $(tests_of "$class")))
            done
            if [ -z "$chosen" ]; then
              echo "The input classes names no class." | tee "$RUNNER_TEMP/selection.txt"
              exit 1
            fi
            for test in $SMOKE_TESTS; do
              if [[ " $chosen " == *" ${test%%/*} "* ]]; then
                continue
              fi
              only+=("-only-testing:ReelsmithUITests/$test")
              selected=$((selected + 1))
            done
            echo "UI tests of this run: a PART run, not every UI test. Classes asked for:$chosen. Tests selected: $selected, the smoke set added." |
              tee "$RUNNER_TEMP/selection.txt"
          elif [ "$GROUP" != 0 ]; then
            number=0
            for class in $(printf '%s\n' $all | LC_ALL=C sort); do
              if [ $((number % 3 + 1)) -eq "$GROUP" ]; then
                chosen="$chosen $class"
                only+=("-only-testing:ReelsmithUITests/$class")
                selected=$((selected + $(tests_of "$class")))
              fi
              number=$((number + 1))
            done
            if [ -z "$chosen" ]; then
              echo "Group $GROUP of 3 holds no class." | tee "$RUNNER_TEMP/selection.txt"
              exit 1
            fi
            echo "UI tests of this run: group $GROUP of 3 of a split run, $number classes in all. Classes of this group:$chosen. Tests selected: $selected of $total." |
              tee "$RUNNER_TEMP/selection.txt"
          else
            echo "UI tests of this run: every UI test on one machine. Tests in the files: $total." |
              tee "$RUNNER_TEMP/selection.txt"
          fi
          xcrun simctl bootstatus "$SIMULATOR" -b
          # One seeded start before the recording and the tests. It writes every clip a seed needs and builds
          # the editor once, so no start inside a test follows the writing of a clip. The app logs a line
          # with "old picture" when its first item goes into the player, which is after the editor is built.
          warm=$SECONDS
          seen=no
          xcrun simctl launch "$SIMULATOR" com.ghanafer.reelsmith -seed three-clips ||
            seen="no, the app did not start"
          while [ "$seen" = no ] && [ $((SECONDS - warm)) -lt 180 ]; do
            sleep 3
            xcrun simctl spawn "$SIMULATOR" log show --last 5m --predicate 'process == "Reelsmith"' \
              > "$RUNNER_TEMP/warm-start.txt" || true
            if grep -q "old picture" "$RUNNER_TEMP/warm-start.txt"; then
              seen=yes
            fi
          done
          echo "The warm start: $((SECONDS - warm)) seconds, the line of the first item seen: $seen"
          xcrun simctl terminate "$SIMULATOR" com.ghanafer.reelsmith || true
          mkdir -p recording results
          date +%s > recording/recording-start.txt
          xcrun simctl io "$SIMULATOR" recordVideo --codec h264 recording/recording.mp4 > "$RUNNER_TEMP/recorder.txt" 2>&1 &
          recorder=$!
          # The file's own time starts when the recorder says it started: that moment, to the
          # thousandth of a second, replaces the clock second in the start file.
          for _ in $(seq 300); do
            if grep -q "Recording started" "$RUNNER_TEMP/recorder.txt"; then
              python3 -c 'import time; print(f"{time.time():.3f}")' > recording/recording-start.txt
              break
            fi
            sleep 0.1
          done
          cat "$RUNNER_TEMP/recorder.txt"
          echo "The start of the recording: $(cat recording/recording-start.txt)"
          status=0
          xcodebuild test-without-building -project Reelsmith.xcodeproj -scheme Reelsmith -destination "id=$SIMULATOR" \
            -derivedDataPath build/simulator -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 600 \
            -maximum-test-execution-time-allowance 600 \
            -resultBundlePath results/Reelsmith.xcresult "${only[@]}" 2>&1 | tee "$RUNNER_TEMP/ui-tests.txt" || status=$?
          # The last line with a count is the total of the run.
          executed=$(grep -E 'Executed [0-9]+ tests?, with' "$RUNNER_TEMP/ui-tests.txt" | tail -n 1 | sed -E 's/.*Executed ([0-9]+) tests?, with.*/\1/' || true)
          echo "UI tests executed: ${executed:-not read}" | tee -a "$RUNNER_TEMP/selection.txt"
          if [ "${#only[@]}" -gt 0 ] && [ "$executed" != "$selected" ]; then
            echo "Selected $selected tests and executed ${executed:-none}: the selection did not run as asked." | tee -a "$RUNNER_TEMP/selection.txt"
            status=1
          fi
          kill -INT "$recorder" || true
          for _ in $(seq 30); do
            kill -0 "$recorder" 2>/dev/null || break
            sleep 1
          done
          if kill -KILL "$recorder" 2>/dev/null; then
            echo "The recorder did not end on the interrupt and was ended hard."
            status=1
          fi
          wait "$recorder" || true
          cat "$RUNNER_TEMP/recorder.txt"
          ls -l recording
          if [ ! -s recording/recording.mp4 ]; then
            echo "No recording was written."
            exit 1
          fi
          exit "$status"

      - name: Keep the app's lines of the simulator log
        if: ${{ !cancelled() && steps.layer4.outcome != 'skipped' }}
        run: |
          trap 'echo "simulator log: ${SECONDS}s" | tee -a "$RUNNER_TEMP/timings.txt"' EXIT
          mkdir -p results
          xcrun simctl spawn "$SIMULATOR" log show --last 30m --predicate 'process == "Reelsmith"' > results/simulator-log.txt ||
            echo "The simulator log could not be read."
          wc -l results/simulator-log.txt || true

      - name: "Layer 5: export the screenshots and marks, write the recording index"
        id: layer5
        if: ${{ always() && steps.layer4.outcome != 'skipped' }}
        run: |
          trap 'echo "layer 5: ${SECONDS}s" | tee -a "$RUNNER_TEMP/timings.txt"' EXIT
          exported="$RUNNER_TEMP/attachments"
          xcrun xcresulttool export attachments --path results/Reelsmith.xcresult --output-path "$exported"
          cat "$exported/manifest.json"
          mkdir -p screens
          # An exported file is named <attachment name>_<number>_<identifier>.<ending> in the manifest.
          # The third column is the moment the attachment was added, in seconds since 1970 to the thousandth.
          jq -r '.[].attachments[] | [.exportedFileName, (.suggestedHumanReadableName // .exportedFileName | gsub("[\r\n]"; "_")), (.timestamp // "")] | @tsv' "$exported/manifest.json" > "$exported/names.tsv"
          failed=0
          : > "$exported/marks.tsv"
          while IFS=$'\t' read -r file suggested stamp; do
            name=$(printf '%s' "$suggested" | sed -E 's/_[0-9]+_[0-9A-Fa-f-]{36}//')
            if [[ "$name" == *.mark.txt* ]]; then
              name="${name%%.mark.txt*}.mark.txt"
            fi
            # The upload refuses these characters in a file name, and a line break, which is replaced above.
            name=$(printf '%s' "$name" | tr '":<>|*?' '_______')
            # A name that is taken gets a number before its ending.
            ending=""
            if [[ "$name" == *.mark.txt ]]; then
              ending=".mark.txt"
            elif [[ "$name" == *.* ]]; then
              ending=".${name##*.}"
            fi
            stem="${name%"$ending"}"
            number=2
            while [ -e "screens/$name" ]; do
              name="${stem}_${number}${ending}"
              number=$((number + 1))
            done
            if ! cp "$exported/$file" "screens/$name"; then
              echo "Not copied: $file as $name"
              failed=1
            elif [ "$ending" = ".mark.txt" ]; then
              # Without a moment in the manifest, the clock second the mark file holds.
              printf '%s\t%s\n' "$stem" "${stamp:-$(cat "screens/$name")}" >> "$exported/marks.tsv"
            fi
          done < "$exported/names.tsv"
          ls -l screens
          if [ -z "$(ls -A screens)" ]; then
            echo "The result bundle gave no attachment."
            failed=1
          fi
          # Each mark in the file's own time: its moment less the start, moved back to the last frame
          # shown at or before it, since the file holds a frame only when the screen changes. The times
          # of the frames are read from the sample tables of the video track (stts and ctts in mdhd units):
          # https://developer.apple.com/documentation/quicktime-file-format
          python3 - recording/recording.mp4 recording/recording-start.txt "$exported/marks.tsv" > recording/recording-index.txt <<'EOF'
          import bisect, math, struct, sys

          movie, start_file, marks_file = sys.argv[1:4]
          start = float(open(start_file).read())


          def boxes(f, begin, end):
              while begin + 8 <= end:
                  f.seek(begin)
                  size, kind = struct.unpack(">I4s", f.read(8))
                  head = 8
                  if size == 1:
                      size = struct.unpack(">Q", f.read(8))[0]
                      head = 16
                  elif size == 0:
                      size = end - begin
                  if size < head:
                      return
                  yield kind, begin + head, begin + size
                  begin += size


          def child(f, begin, end, kind):
              return next(((b, e) for k, b, e in boxes(f, begin, end) if k == kind), None)


          def frame_times(path):
              with open(path, "rb") as f:
                  f.seek(0, 2)
                  moov = child(f, 0, f.tell(), b"moov")
                  if moov is None:
                      return []
                  for kind, b, e in boxes(f, *moov):
                      if kind != b"trak":
                          continue
                      mdia = child(f, b, e, b"mdia")
                      hdlr = child(f, *mdia, b"hdlr")
                      f.seek(hdlr[0] + 8)
                      if f.read(4) != b"vide":
                          continue
                      mdhd = child(f, *mdia, b"mdhd")
                      f.seek(mdhd[0])
                      version = f.read(1)[0]
                      f.seek(mdhd[0] + (20 if version == 1 else 12))
                      scale = struct.unpack(">I", f.read(4))[0]
                      stbl = child(f, *child(f, *mdia, b"minf"), b"stbl")
                      durations = []
                      stts = child(f, *stbl, b"stts")
                      f.seek(stts[0] + 4)
                      for _ in range(struct.unpack(">I", f.read(4))[0]):
                          count, delta = struct.unpack(">II", f.read(8))
                          durations += [delta] * count
                      offsets = [0] * len(durations)
                      ctts = child(f, *stbl, b"ctts")
                      if ctts is not None:
                          f.seek(ctts[0] + 4)
                          at = 0
                          for _ in range(struct.unpack(">I", f.read(4))[0]):
                              count, offset = struct.unpack(">Ii", f.read(8))
                              offsets[at:at + count] = [offset] * count
                              at += count
                      times, decode = [], 0
                      for duration, offset in zip(durations, offsets):
                          times.append((decode + offset) / scale)
                          decode += duration
                      return sorted(times)
              return []


          try:
              frames = frame_times(movie)
          except (OSError, struct.error, TypeError, IndexError):
              frames = []
          if not frames:
              print("The recording could not be read: each mark is given unmoved.", file=sys.stderr)

          for line in sorted(open(marks_file)):
              name, stamp = line.rstrip("\n").split("\t")
              second = float(stamp) - start
              at = bisect.bisect_right(frames, second)
              if at > 0:
                  second = frames[at - 1]
              second = max(second, 0.0)
              print(f"{name} {math.floor(second * 100) / 100:.2f}")
          EOF
          cat recording/recording-index.txt
          exit "$failed"

      - name: "Layer 6: count the videos in the library again"
        id: layer6
        if: ${{ !cancelled() && steps.layer3.outcome != 'skipped' }}
        run: |
          trap 'echo "layer 6: ${SECONDS}s" | tee -a "$RUNNER_TEMP/timings.txt"' EXIT
          library="$HOME/Library/Developer/CoreSimulator/Devices/$SIMULATOR/data/Media/PhotoData/Photos.sqlite"
          count=$(sqlite3 -readonly "$library" "select count(*) from ZASSET where ZKIND = 1 and ZTRASHEDSTATE = 0") || count="could not be read"
          echo "Videos in the library after the UI tests: $count" | tee -a "$RUNNER_TEMP/library.txt"
          photos=$(sqlite3 -readonly "$library" "select count(*) from ZASSET where ZKIND = 0 and ZTRASHEDSTATE = 0") || photos="could not be read"
          echo "Photos in the library after the UI tests: $photos" | tee -a "$RUNNER_TEMP/library.txt"

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: ${{ matrix.group == 0 && 'screens' || format('screens-{0}', matrix.group) }}
          path: screens
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: ${{ matrix.group == 0 && 'recording' || format('recording-{0}', matrix.group) }}
          path: recording
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: ${{ matrix.group == 0 && 'results' || format('results-{0}', matrix.group) }}
          path: results
          retention-days: 3

      - name: "Layer 7: build for a device without code signing"
        id: layer7
        if: ${{ !cancelled() && inputs.ipa && matrix.group < 2 && hashFiles('Reelsmith.xcodeproj/project.pbxproj') != '' }}
        run: |
          trap 'echo "layer 7: ${SECONDS}s" | tee -a "$RUNNER_TEMP/timings.txt"' EXIT
          xcodebuild build -project Reelsmith.xcodeproj -scheme Reelsmith -configuration Release \
            -destination "generic/platform=iOS" -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO GIT_COMMIT="$(git rev-parse --short HEAD)"
          mkdir Payload
          cp -R build/device/Build/Products/Release-iphoneos/Reelsmith.app Payload/
          zip -qr Reelsmith.ipa Payload

      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.ipa && matrix.group < 2 }}
        with:
          name: ipa
          path: Reelsmith.ipa
          retention-days: 3

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "Setup, Xcode 26.6 and the simulator: ${{ steps.setup.outcome }}"
            echo "Layer 1, the package and the Engine tests on macOS: ${{ steps.layer1.outcome }}"
            echo "Layer 2, the project, the app and the UI tests built: ${{ steps.layer2.outcome }}"
            echo "Layer 3, simulator, install, Photos, clips: ${{ steps.layer3.outcome }}"
            echo "Layer 4, the recording and the UI tests: ${{ steps.layer4.outcome }}"
            echo "Layer 5, screenshots, marks and the index: ${{ steps.layer5.outcome }}"
            echo "Layer 6, the count again: ${{ steps.layer6.outcome }}"
            echo "Layer 7, the device build: ${{ inputs.ipa && steps.layer7.outcome || 'not asked for' }}"
            echo "A layer that reads skipped was not attempted."
            echo
            cat "$RUNNER_TEMP/selection.txt" 2>/dev/null || echo "The choice of the UI tests was not reached."
            echo
            cat "$RUNNER_TEMP/library.txt" 2>/dev/null || echo "The library was not reached."
            echo
            echo "Seconds per step:"
            cat "$RUNNER_TEMP/timings.txt"
          } | sed 's/$/  /' | tee -a "$GITHUB_STEP_SUMMARY"
